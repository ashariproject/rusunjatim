server {
    listen 80;
    server_name localhost rusunjatim.my.id www.rusunjatim.my.id;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Internal Docker DNS resolver to prevent startup crash if backend is starting
    resolver 127.0.0.11 valid=10s;

    # Frontend Static Pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Route untuk Proyek Ongoing (/proyek/2026/tnialpasuruan -> proyek.html)
    location ~ ^/proyek/\d{4}/[^/]+/?$ {
        rewrite ^/proyek/\d{4}/[^/]+/?$ /proyek.html break;
    }

    # API Proxy
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Documentation Proxy
    location /docs {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }

    # Uploads & Images Proxy
    location /uploads/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }

    location /images/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }
}
